[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "album-cover-studio-backend"
version = "1.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "librosa==0.11.0",
  "numba==0.61.2",
  "llvmlite==0.44.0",
  "numpy>=1.26,<2.3",
  "pillow>=10,<13",
  "psycopg[binary]>=3.2,<4",
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
