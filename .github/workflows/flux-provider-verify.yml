name: FLUX provider verification

on:
  push:
    branches: [fix/flux-image-provider]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Audio analysis tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_audio_analysis.py
      - name: Commercial benchmarking tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_commercial_benchmarking.py
      - name: Creative director tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_creative_director.py
      - name: FLUX renderer tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_flux_image_renderer.py
      - name: Improvement feedback tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_improvement_feedback.py
      - name: Load testing tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_load_testing.py
      - name: Metrics tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_metrics.py
      - name: OpenAI legacy adapter tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_openai_client.py
      - name: Pipeline tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_pipeline.py
      - name: Prompt tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_prompts.py
      - name: Typography tests
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_typography.py
