name: FLUX provider verification

on:
  push:
    branches: [feat/flux-image-provider]
    paths:
      - "backend/app/image_client.py"
      - "backend/app/config.py"
      - "backend/app/main.py"
      - "backend/app/errors.py"
      - "backend/tests/test_flux_image_renderer.py"
      - ".github/workflows/flux-provider.yml"
  pull_request:
    paths:
      - "backend/app/image_client.py"
      - "backend/app/config.py"
      - "backend/app/main.py"
      - "backend/app/errors.py"
      - "backend/tests/test_flux_image_renderer.py"
      - ".github/workflows/flux-provider.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        run: python -m pip install -r backend/requirements.txt
      - name: Run FLUX provider tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_flux_image_renderer.py
