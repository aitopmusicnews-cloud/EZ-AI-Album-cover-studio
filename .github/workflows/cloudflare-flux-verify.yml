name: Cloudflare FLUX verification

on:
  push:
    branches: [fix/remove-pollinations]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run Cloudflare FLUX regression test
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_flux_image_renderer.py
