name: Gemini Cover Renderer Verification

on:
  push:
    branches:
      - fix/gemini-image-renderer

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Gemini renderer patch
        run: python scripts/patch_gemini_renderer.py
      - name: Install backend test dependencies
        run: python -m pip install -e './backend[test]'
      - name: Gemini renderer regression
        run: pytest -q backend/tests/test_gemini_image_renderer.py
      - name: Full backend test suite
        run: pytest -q backend/tests
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Commit verified provider switch
        run: |
          rm scripts/patch_gemini_renderer.py
          rm .github/workflows/gemini-renderer-verify.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Switch album cover image rendering to Gemini"
          git push origin HEAD:fix/gemini-image-renderer
