name: Load test harness

on:
  push:
    branches: [main, agent/load-testing]
    paths:
      - "backend/app/load_testing.py"
      - "backend/tests/test_load_testing.py"
      - "LOAD_TESTING.md"
      - "Makefile"
      - ".github/workflows/load-test-harness.yml"
  pull_request:
    paths:
      - "backend/app/load_testing.py"
      - "backend/tests/test_load_testing.py"
      - "LOAD_TESTING.md"
      - "Makefile"
      - ".github/workflows/load-test-harness.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight test dependencies
        run: python -m pip install "httpx>=0.27,<1" "pytest>=8,<10"
      - name: Compile load test module
        run: python -m py_compile backend/app/load_testing.py
      - name: Run load harness tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_load_testing.py
